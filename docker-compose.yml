services:
  db:
    image: postgres:16-alpine
    container_name: group-awards-db
    environment:
      POSTGRES_DB: group_awards
      POSTGRES_USER: awards
      POSTGRES_PASSWORD: awards_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awards -d group_awards"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
